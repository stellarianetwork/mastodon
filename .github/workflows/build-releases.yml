name: Build container release images
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  check-latest-stable:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.is_latest_stable }}
      tags: ${{ steps.check.outputs.tags }}
      metadata: ${{ steps.check.outputs.metadata }}
    steps:
      # Repository needs to be cloned to list branches
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare release tags
        shell: bash
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          next_release_number() (
            set -euo pipefail
            version=${1:?Expected an upstream version}
            shift
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || $# == 0 ]]; then
              echo 'Expected an upstream version and Docker repositories.' >&2
              exit 1
            fi

            highest=0
            for repository in "$@"; do
              url="https://hub.docker.com/v2/namespaces/${repository/\//\/repositories\/}/tags?page_size=100"
              while [[ -n "$url" ]]; do
                page=$(curl --fail --silent --show-error --max-time 30 "$url")
                number=$(jq --exit-status --arg prefix "v${version}-stellaria." '
                  if type != "object" or (.results | type) != "array" or
                    (has("next") | not) or (.next != null and (.next | type) != "string") or
                    any(.results[]; (.name | type) != "string") then
                    error("Invalid Docker Hub tag response")
                  else
                    [.results[].name | select(startswith($prefix)) | ltrimstr($prefix) |
                      select(test("^[1-9][0-9]*$")) | tonumber] | max // 0 |
                    if . >= 9007199254740991 then error("Release number exceeds exact integer range") else . end
                  end
                ' <<< "$page")
                if (( number > highest )); then
                  highest=$number
                fi
                url=$(jq --raw-output '.next // empty' <<< "$page")
              done
            done
            echo "$((highest + 1))"
          )

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version=$(ruby -r ./lib/mastodon/version.rb -e 'puts Mastodon::Version.to_a.join(".")')
            release_number=$(next_release_number "$version" \
              eaaaaaaaaaaai/stellaria-mastodon eaaaaaaaaaaai/stellaria-mastodon-streaming)
            image_tag="v${version}-stellaria.${release_number}"
            if (( ${#image_tag} > 128 )); then
              echo '::error::Release number produces a Docker tag longer than 128 characters.'
              exit 1
            fi

            {
              echo "tags=type=raw,value=$image_tag"
              echo "metadata=stellaria.$release_number"
              echo 'is_latest_stable=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'tags<<RELEASE_TAGS'
            echo 'type=pep440,pattern={{raw}}'
            echo 'type=pep440,pattern=v{{major}}.{{minor}}'
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"

          ref="${GITHUB_REF#refs/tags/}"

          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            current="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "tag $ref is not semver"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/stable-*.*" \
            | sed -E 's#^origin/stable-##' \
            | sort -Vr \
            | head -n1)

          if [[ "$current" == "$latest" ]]; then
            echo "is_latest_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit

  build-image-streaming:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon-streaming
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit
