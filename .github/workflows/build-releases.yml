name: Build container release images
on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Stellaria release number (positive integer, for example 1)'
        required: true
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  check-latest-stable:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.is_latest_stable }}
      tags: ${{ steps.check.outputs.tags }}
      metadata: ${{ steps.check.outputs.metadata }}
    steps:
      # Repository needs to be cloned to list branches
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare release tags
        shell: bash
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::Release number must be a positive integer.'
              exit 1
            fi

            version=$(ruby -r ./lib/mastodon/version.rb -e 'puts Mastodon::Version.to_a.join(".")')
            image_tag="v${version}-stellaria.${RELEASE_NUMBER}"
            if (( ${#image_tag} > 128 )); then
              echo '::error::Release number produces a Docker tag longer than 128 characters.'
              exit 1
            fi

            {
              echo "tags=type=raw,value=$image_tag"
              echo "metadata=stellaria.$RELEASE_NUMBER"
              echo 'is_latest_stable=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'tags<<RELEASE_TAGS'
            echo 'type=pep440,pattern={{raw}}'
            echo 'type=pep440,pattern=v{{major}}.{{minor}}'
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"

          ref="${GITHUB_REF#refs/tags/}"

          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            current="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "tag $ref is not semver"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/stable-*.*" \
            | sed -E 's#^origin/stable-##' \
            | sort -Vr \
            | head -n1)

          if [[ "$current" == "$latest" ]]; then
            echo "is_latest_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit

  build-image-streaming:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon-streaming
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit
