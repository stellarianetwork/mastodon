name: Build container release images
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# Manual releases pick the next number from Docker Hub, so they must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check-latest-stable:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.is_latest_stable }}
      tags: ${{ steps.check.outputs.tags }}
      metadata: ${{ steps.check.outputs.metadata }}
    steps:
      # Repository needs to be cloned to list branches
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare release tags
        shell: bash
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version=$(ruby -r ./lib/mastodon/version.rb -e 'puts Mastodon::Version.to_a.join(".")')
            prefix="v${version}-stellaria."

            # Both images are always released together, so their latest numbers must match.
            release_numbers=()
            for repository in eaaaaaaaaaaai/stellaria-mastodon eaaaaaaaaaaai/stellaria-mastodon-streaming; do
              response=$(curl --fail --silent --show-error --get \
                --data-urlencode "name=$prefix" \
                --data-urlencode 'page_size=100' \
                "https://hub.docker.com/v2/repositories/$repository/tags")

              # Paging is not implemented because 100 releases of one upstream version is not expected.
              if [[ $(jq -r '.next' <<< "$response") != null ]]; then
                echo "::error::$repository has more than 100 tags matching $prefix."
                exit 1
              fi

              release_numbers+=("$(jq -r --arg prefix "$prefix" '
                [.results[].name
                  | select(startswith($prefix))
                  | ltrimstr($prefix)
                  | select(test("^[1-9][0-9]*$"))
                  | tonumber]
                | max // 0' <<< "$response")")
            done

            if [[ "${release_numbers[0]}" != "${release_numbers[1]}" ]]; then
              echo "::error::Latest release numbers differ between images (${release_numbers[0]} and ${release_numbers[1]})."
              exit 1
            fi

            release_number=$((release_numbers[0] + 1))
            image_tag="${prefix}${release_number}"
            if (( ${#image_tag} > 128 )); then
              echo "::error::Docker tag $image_tag is longer than 128 characters."
              exit 1
            fi

            {
              echo "tags=type=raw,value=$image_tag"
              echo "metadata=stellaria.$release_number"
              echo 'is_latest_stable=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'tags<<RELEASE_TAGS'
            echo 'type=pep440,pattern={{raw}}'
            echo 'type=pep440,pattern=v{{major}}.{{minor}}'
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"

          ref="${GITHUB_REF#refs/tags/}"

          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            current="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "tag $ref is not semver"
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/stable-*.*" \
            | sed -E 's#^origin/stable-##' \
            | sort -Vr \
            | head -n1)

          if [[ "$current" == "$latest" ]]; then
            echo "is_latest_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_stable=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit

  build-image-streaming:
    needs: check-latest-stable
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      push_to_images: |
        eaaaaaaaaaaai/stellaria-mastodon-streaming
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      version_metadata: ${{ needs.check-latest-stable.outputs.metadata }}
      # Manual releases update latest; tag pushes use the latest stable check.
      flavor: |
        latest=${{ needs.check-latest-stable.outputs.latest }}
      tags: ${{ needs.check-latest-stable.outputs.tags }}
    secrets: inherit
